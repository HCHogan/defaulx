name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nix:
    name: Nix build and checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      - run: nix develop -c stylua --check .
      - run: nix develop -c selene .

  neovim:
    name: Plain Neovim ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.version }}
      - run: nvim --clean --headless -l scripts/build.lua --check
      - run: nvim --clean --headless -l tests/run.lua
